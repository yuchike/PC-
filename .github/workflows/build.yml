name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --noconsole --name PCSpecViewer pc_spec_gform.py
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PCSpecViewer-Windows
          path: dist/PCSpecViewer/
